# Keeps the Discord server informed: new flasher versions in #announcements, merged pull requests and
# new experimental / tested mods in #dev-updates. See .github/scripts/discord.mjs.
# Needs the repository secrets DISCORD_WEBHOOK_ANNOUNCEMENTS and DISCORD_WEBHOOK_DEV_UPDATES
# (Discord: Server Settings > Integrations > Webhooks > Copy Webhook URL). Without them, the jobs skip their posts.
name: Discord

on:
  push:
    branches: [main]
    paths:
      - docs/assets/release.js
      - docs/flasher/tweaks.js
  # pull_request_target so that merges of pull requests from forks can post too. It runs the workflow and the
  # script from main, never the pull request's code, and reads the title only from the event payload.
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

env:
  DISCORD_ROLE_RELEASES: "1556468079918186627"
  DISCORD_ROLE_TESTERS: "1556468075740790816"
  DISCORD_CHANNEL_TEST_REPORTS: "1556468305899036682"

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Announce new versions and mod status changes
        env:
          DISCORD_WEBHOOK_ANNOUNCEMENTS: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
          DISCORD_WEBHOOK_DEV_UPDATES: ${{ secrets.DISCORD_WEBHOOK_DEV_UPDATES }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node .github/scripts/discord.mjs release "$BEFORE" "$AFTER"

  merged:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post the merged pull request
        env:
          DISCORD_WEBHOOK_DEV_UPDATES: ${{ secrets.DISCORD_WEBHOOK_DEV_UPDATES }}
        run: node .github/scripts/discord.mjs pr
