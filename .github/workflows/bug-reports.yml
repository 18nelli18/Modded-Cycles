name: Bug report inbox
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  notify-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const route = require('./.github/scripts/bug-reports.cjs');
            await route({github, context});
